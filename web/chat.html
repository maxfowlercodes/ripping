<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Chat</title>
<style>
:root{--ac:#6366f1;--bg:#f6f7fb;--card:#fff;--fg:#0f172a;--mut:#64748b;--line:#0f172a14}@media(prefers-color-scheme:dark){:root{--bg:#0b0f1a;--card:#141a2b;--fg:#e8ecf5;--mut:#8b95b0;--line:#ffffff18}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:560px;flex:1;display:flex;flex-direction:column;padding:16px;min-height:0}
header{padding:18px 4px 12px}h1{margin:0;font-size:24px;letter-spacing:-.02em}p.t{margin:4px 0 0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}textarea{min-height:90px;resize:vertical}
button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mut);margin-top:14px}.chk input{width:auto;margin-top:3px}
#chat{display:none;flex:1;min-height:0;flex-direction:column}#log{flex:1;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:11px 15px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}.m.a{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}.m.u{background:var(--ac);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
#send{display:flex;gap:8px;padding:10px 0 4px}#send input{flex:1}.err{color:#dc2626;font-size:14px;margin-top:8px;min-height:1em}.foot{font-size:12px;color:var(--mut);text-align:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style></head><body><div class="wrap">
<header><h1 id="name">…</h1><p class="t" id="tag"></p></header>
<form id="lead" class="card" autocomplete="on"><b>Before we chat</b>
<label for="n">Your name</label><input id="n" name="name" maxlength="80" required autocomplete="name">
<label for="e">Email</label><input id="e" name="email" type="email" maxlength="120" required autocomplete="email">
<label for="d">What are you looking for?</label><textarea id="d" name="need" maxlength="600" required placeholder="A sentence or two about your situation"></textarea>
<div class="hp" aria-hidden="true"><label>Website<input id="w" tabindex="-1" autocomplete="off"></label></div>
<label class="chk"><input type="checkbox" id="c"><span id="consent"></span></label>
<div class="err" id="err" role="alert"></div><p><button id="go" type="submit">Start chat</button></p></form>
<div id="chat"><div id="log" aria-live="polite"></div><form id="send"><input id="msg" maxlength="500" placeholder="Type a message…" autocomplete="off" required><button id="sb">Send</button></form></div>
<div class="foot">AI assistant: replies may be imperfect, and the owner may follow up by email.</div></div>
<script src="/chat.js"></script></body></html>
