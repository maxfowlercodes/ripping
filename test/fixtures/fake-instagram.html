<!doctype html><html><body style="font-family:sans-serif"><style>@keyframes w{from{transform:translateX(0)}to{transform:translateX(3px)}}.anim{animation:w .2s infinite alternate}</style>
<nav class="anim"><a href="#" id="create"><svg aria-label="Home" width=24 height=24></svg></a> <a role="link" tabindex=0 id="plus"><svg aria-label="New post" width=24 height=24><rect width=24 height=24 /></svg></a><svg aria-label="a" width=3 height=3></svg><svg aria-label="b" width=3 height=3></svg></nav>
<div id="menu" style="display:none"><div role="menuitem" tabindex=0 onclick="openDlg()"><span>Post</span></div></div>
<div id="dlg" role="dialog" style="display:none"><div id="s1"><button onclick="document.querySelector('input').click()">Select from computer</button><input type=file accept="video/mp4,video/quicktime" style="display:none"></div><div id="s2" style="display:none">Crop<div role="button" tabindex=0 id="n1">Next</div></div><div id="s3" style="display:none">Edit<div role="button" tabindex=0 id="n2">Next</div></div><div id="s4" style="display:none">New reel<div role="textbox" contenteditable="true" aria-label="Write a caption..." style="border:1px solid"></div><div role="button" tabindex=0 id="share">Share</div></div><div id="done" style="display:none">Your reel has been shared</div></div>
<script>plus.onclick=()=>menu.style.display='block';function openDlg(){dlg.style.display='block';menu.style.display='none'}
document.querySelector('input').onchange=()=>{s1.style.display='none';s2.style.display='block'};n1.onclick=()=>{s2.style.display='none';s3.style.display='block'};n2.onclick=()=>{s3.style.display='none';s4.style.display='block'};share.onclick=()=>{s4.style.display='none';done.style.display='block'}</script></body></html>
